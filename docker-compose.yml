services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: corra
      POSTGRES_PASSWORD: corra
      POSTGRES_DB: corra
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corra"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
