services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: corra
      POSTGRES_PASSWORD: corra
      POSTGRES_DB: corra
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corra"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Usage counts for the local stack (scripts/local-stack.sh): http://stats.localhost:8094
  goatcounter:
    image: arp242/goatcounter:2.7.0
    ports:
      - "127.0.0.1:8094:8080"
    volumes:
      - goatcounter-data:/home/goatcounter/goatcounter-data

volumes:
  pgdata:
  goatcounter-data:
